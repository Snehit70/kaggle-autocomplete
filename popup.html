<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 220px; margin: 12px; }
      label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
      input[type='number'] { width: 60px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { color: #666; font-size: 11px; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <h1>Kaggle Autocomplete</h1>
    <label>Enabled <input id="enabled" type="checkbox" /></label>
    <label>Delay (ms) <input id="delay" type="number" min="0" max="2000" step="50" /></label>
    <label>Min. chars <input id="minChars" type="number" min="1" max="5" /></label>
    <p>The notebook session must be running: suggestions come from the kernel.</p>
    <script src="popup.js"></script>
  </body>
</html>
